name: Renovate Runner

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Niveau de log Renovate'
        type: choice
        default: 'info'
        options:
          - 'info'
          - 'debug'
          - 'warn'
  schedule:
    # Exécution planifiée hebdomadaire le lundi à 04:00 UTC (après cargo-deny/gitleaks)
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: Renovate Dependency Bot
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Renovate Action
        uses: renovatebot/github-action@v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
